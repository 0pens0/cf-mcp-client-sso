spring:
  autoconfigure:
    # With multiple GenAI bindings, CfGenaiProcessor overwrites genai.locator.* per service;
    # the single GenaiLocatorAutoConfiguration bean then mixes API key and URL from different
    # instances (401 from genai-proxy). MultiGenaiLocatorConfiguration supplies one locator per service.
    exclude:
      - io.pivotal.cfenv.boot.genai.GenaiLocatorAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  application:
    name: cf-mcp-client
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  session:
    store-type: jdbc

app:
  multigenai:
    enabled: true

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG